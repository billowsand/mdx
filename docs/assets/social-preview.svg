<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">mdx — Markdown to Chinese DOCX and TeX</title>
  <desc id="desc">GitHub social preview for the mdx document converter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1020" cy="80" r="240" fill="#f59e0b" opacity="0.07"/>
  <circle cx="1050" cy="620" r="310" fill="#fb7185" opacity="0.05"/>

  <g transform="translate(90 82)">
    <rect width="1020" height="466" rx="34" fill="#0f172a" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.10" filter="url(#shadow)"/>
    <rect x="0" y="0" width="10" height="466" rx="5" fill="url(#accent)"/>

    <g transform="translate(72 78)">
      <rect width="172" height="172" rx="36" fill="#1f2937" stroke="#f59e0b" stroke-width="3"/>
      <path d="M48 46h54l24 24v58H48z" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linejoin="round"/>
      <path d="M102 46v26h25" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linejoin="round"/>
      <path d="M66 94h44M66 113h30" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
    </g>

    <text x="300" y="154" fill="#f8fafc" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="108" font-weight="800" letter-spacing="-4">mdx</text>
    <text x="304" y="207" fill="#fbbf24" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="28" font-weight="650">Markdown → 中文专业文档</text>
    <text x="304" y="260" fill="#cbd5e1" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="27">公文 · 研究报告　×　DOCX · TeX / PDF</text>

    <g transform="translate(304 304)" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="20" font-weight="600">
      <rect width="142" height="48" rx="24" fill="#0c4a6e" stroke="#38bdf8"/>
      <text x="71" y="31" text-anchor="middle" fill="#e0f2fe">Pure Rust</text>
      <rect x="158" width="168" height="48" rx="24" fill="#14532d" stroke="#4ade80"/>
      <text x="242" y="31" text-anchor="middle" fill="#dcfce7">No Pandoc</text>
      <rect x="342" width="194" height="48" rx="24" fill="#713f12" stroke="#fbbf24"/>
      <text x="439" y="31" text-anchor="middle" fill="#fef3c7">Cross-platform</text>
    </g>

    <text x="72" y="412" fill="#94a3b8" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="21">结构化长文档 · 封面与目录 · 图表编号 · 交叉引用 · BibTeX</text>
  </g>
</svg>
