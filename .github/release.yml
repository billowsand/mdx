changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot[bot]
  categories:
    - title: "⚠️ 破坏性变更"
      labels:
        - breaking-change
        - semver-major
    - title: "✨ 新功能"
      labels:
        - enhancement
        - semver-minor
    - title: "🐛 修复"
      labels:
        - bug
        - semver-patch
    - title: "📚 文档与维护"
      labels:
        - documentation
        - dependencies
        - maintenance
    - title: "其他变更"
      labels:
        - "*"