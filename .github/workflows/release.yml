name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TECTONIC_VERSION: "0.17.0"

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify tag and manifest
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and verify version
        id: version
        shell: bash
        run: |
          manifest_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ -z "$manifest_version" ]]; then
            echo "Unable to read package version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${manifest_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${manifest_version}" >&2
            exit 1
          fi
          echo "version=${manifest_version}" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Run release checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features --locked

  prepare-tectonic-bundle:
    name: Prepare offline Tectonic bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified Tectonic
        shell: bash
        run: |
          asset="tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --silent --show-error \
            --output tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/${asset}"
          echo "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  tectonic.tar.gz" \
            | sha256sum --check --strict
          mkdir tectonic-bin
          tar -xzf tectonic.tar.gz -C tectonic-bin
      - name: Resolve and verify curated bundle
        shell: bash
        run: |
          tectonic_executable=$(find "$PWD/tectonic-bin" -type f -name tectonic -print -quit)
          test -n "$tectonic_executable"
          bash scripts/prepare-tectonic-bundle.sh \
            "$tectonic_executable" \
            "$PWD/tectonic-bundle"
      - name: Upload curated bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tectonic-bundle
          path: tectonic-bundle/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: [verify-version, prepare-tectonic-bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            build_image: quay.io/pypa/manylinux_2_28_x86_64:latest
            tectonic_asset: tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz
            tectonic_sha256: 8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            build_image: quay.io/pypa/manylinux_2_28_aarch64:latest
            tectonic_asset: tectonic-0.17.0-aarch64-unknown-linux-musl.tar.gz
            tectonic_sha256: b10954a95404f3ab2328d2fa59a5ebab8e657f893fab096f98be8db7c0c979b8
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            tectonic_asset: tectonic-0.17.0-x86_64-pc-windows-msvc.zip
            tectonic_sha256: f61ce51f0b0ade1015b7de7ef368541c5424e9756ecbd0d7af97d6d48030845f
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
            tectonic_asset: tectonic-0.17.0-x86_64-apple-darwin.tar.gz
            tectonic_sha256: 7c90ef5b6ddb1eb1937e4337add5237b79338e4b9676459fa91187d24d6cdf80
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            tectonic_asset: tectonic-0.17.0-aarch64-apple-darwin.tar.gz
            tectonic_sha256: a3f1cac7c5678f01661a92212f58480ae3b0634115d880dbc59e2953ded45667
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust target
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build Linux against glibc 2.28
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUILD_IMAGE: ${{ matrix.build_image }}
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm \
            --env TARGET \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$BUILD_IMAGE" \
            bash -euxo pipefail -c '
              dnf install -y \
                curl ca-certificates openssl-devel fontconfig-devel \
                libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel \
                libX11-devel libXcursor-devel libXi-devel libXrandr-devel \
                mesa-libGL-devel wayland-devel
              curl --proto "=https" --tlsv1.2 --silent --show-error --fail \
                https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
              source "$HOME/.cargo/env"
              rustup target add "$TARGET"
              cargo build --release --locked --all-features --target "$TARGET"
            '
      - name: Verify Linux glibc baseline
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          versions=$(objdump -T "target/${TARGET}/release/mdx" \
            | sed -n 's/.*GLIBC_\([0-9][0-9.]*\).*/\1/p' \
            | sort -Vu)
          highest=$(printf '%s\n' "$versions" | tail -n 1)
          incompatible=$(printf '%s\n' "$versions" \
            | awk -F. '$1 > 2 || ($1 == 2 && $2 > 28)')
          echo "Highest required glibc symbol: ${highest:-none}"
          if [[ -n "$incompatible" ]]; then
            echo "Found glibc requirements newer than 2.28:" >&2
            echo "$incompatible" >&2
            exit 1
          fi
      - name: Build non-Linux
        if: runner.os != 'Linux'
        run: cargo build --release --locked --all-features --target ${{ matrix.target }}
      - name: Download curated Tectonic bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tectonic-bundle
          path: target/tectonic-runtime/bundle
      - name: Download verified Tectonic executable
        shell: bash
        env:
          TECTONIC_ASSET: ${{ matrix.tectonic_asset }}
          TECTONIC_SHA256: ${{ matrix.tectonic_sha256 }}
        run: |
          mkdir -p target/tectonic-runtime/extracted
          curl --fail --location --silent --show-error \
            --output target/tectonic-runtime/archive \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/${TECTONIC_ASSET}"
          echo "${TECTONIC_SHA256}  target/tectonic-runtime/archive" \
            | sha256sum --check --strict
          case "$TECTONIC_ASSET" in
            *.zip) unzip -q target/tectonic-runtime/archive -d target/tectonic-runtime/extracted ;;
            *.tar.gz) tar -xzf target/tectonic-runtime/archive -C target/tectonic-runtime/extracted ;;
            *) echo "Unsupported Tectonic archive: $TECTONIC_ASSET" >&2; exit 1 ;;
          esac
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            source_executable=$(find target/tectonic-runtime/extracted -type f -name tectonic.exe -print -quit)
            test -n "$source_executable"
            cp "$source_executable" target/tectonic-runtime/tectonic.exe
            target/tectonic-runtime/tectonic.exe --version
          else
            source_executable=$(find target/tectonic-runtime/extracted -type f -name tectonic -print -quit)
            test -n "$source_executable"
            cp "$source_executable" target/tectonic-runtime/tectonic
            chmod +x target/tectonic-runtime/tectonic
            target/tectonic-runtime/tectonic --version
          fi
      - name: Verify binaries
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./target/${{ matrix.target }}/release/mdx.exe --version
            test -f ./target/${{ matrix.target }}/release/mdx-gui.exe
          else
            ./target/${{ matrix.target }}/release/mdx --version
            test -f ./target/${{ matrix.target }}/release/mdx-gui
          fi
      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          package="mdx-v${VERSION}-${TARGET}"
          mkdir -p "dist/${package}"
          cp "target/${TARGET}/release/mdx" "dist/${package}/"
          cp "target/${TARGET}/release/mdx-gui" "dist/${package}/"
          cp README.md LICENSE CHANGELOG.md "dist/${package}/"
          mkdir -p "dist/${package}/runtime/bundle" "dist/${package}/runtime/licenses"
          cp target/tectonic-runtime/tectonic "dist/${package}/runtime/"
          cp -R target/tectonic-runtime/bundle/. "dist/${package}/runtime/bundle/"
          cp resources/tectonic/LICENSE-TECTONIC.txt resources/tectonic/BUNDLE-NOTICE.md \
            "dist/${package}/runtime/licenses/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $package = "mdx-v$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Force "dist/$package" | Out-Null
          Copy-Item "target/$env:TARGET/release/mdx.exe" "dist/$package/"
          Copy-Item "target/$env:TARGET/release/mdx-gui.exe" "dist/$package/"
          Copy-Item -Path README.md, LICENSE, CHANGELOG.md -Destination "dist/$package/"
          New-Item -ItemType Directory -Force "dist/$package/runtime/bundle" | Out-Null
          New-Item -ItemType Directory -Force "dist/$package/runtime/licenses" | Out-Null
          Copy-Item "target/tectonic-runtime/tectonic.exe" "dist/$package/runtime/"
          Copy-Item -Path "target/tectonic-runtime/bundle/*" -Destination "dist/$package/runtime/bundle/" -Recurse
          Copy-Item -Path resources/tectonic/LICENSE-TECTONIC.txt, resources/tectonic/BUNDLE-NOTICE.md -Destination "dist/$package/runtime/licenses/"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"
      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mdx-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [verify-version, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mdx-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
