name: Bug report
description: 报告可复现的转换错误或异常行为
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请不要在此公开提交，请改用 SECURITY.md 中的私密渠道。
  - type: checkboxes
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有重复报告。
          required: true
        - label: 我已阅读 README 与 Markdown 扩展说明。
          required: true
        - label: 输入示例已经脱敏，不含机密或个人信息。
          required: true
  - type: input
    attributes:
      label: mdx 版本
      description: 请粘贴 `mdx --version` 的输出。
      placeholder: mdx 2.4.0
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 输出组合
      options:
        - docx / official
        - docx / research
        - tex / official
        - tex / research
        - 其他或不确定
    validations:
      required: true
  - type: input
    attributes:
      label: 操作系统
      placeholder: Windows 11 / Ubuntu 24.04 / macOS 15
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现命令与最小输入
      description: 请提供可复制的命令和尽可能小的 Markdown。可使用附件，但不要上传敏感文档。
      render: shell
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实际行为
      description: 包括完整错误信息或输出表现。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    attributes:
      label: 补充信息
      description: 可附无敏感信息的截图、字体列表或 TeX 工具链版本。